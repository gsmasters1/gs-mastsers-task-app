<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <meta name="theme-color" content="#1e2a3a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="GSM Field" />
    <title>GS Masters Field App</title>
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/icon-admin.png" />
    <link rel="icon" href="%PUBLIC_URL%/icon-admin.png" />
  </head>
  <body style="background:#1e2a3a;color:#f8fafc;margin:0">
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script>
      window.onerror = function(msg, src, line, col, err) {
        if (document.getElementById('root') && !document.getElementById('root').children.length) {
          document.body.innerHTML = '<div style="padding:40px 20px;font-family:sans-serif;text-align:center"><div style="font-size:40px;margin-bottom:16px">⚠️</div><div style="font-size:18px;font-weight:700;margin-bottom:8px">App Error</div><div style="font-size:13px;color:#94a3b8;margin-bottom:24px;word-break:break-all">' + msg + '</div><button onclick="location.reload()" style="padding:12px 28px;background:#3b82f6;color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer">Reload App</button></div>';
        }
      };
    </script>
  </body>
</html>
