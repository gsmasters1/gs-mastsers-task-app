<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#0f1923">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="GSM Receipt">
  <title>GSM Receipt</title>
  <link rel="manifest" href="/receipt/manifest.json">
  <link rel="apple-touch-icon" href="/icon-crew.png">
  <link rel="icon" href="/icon-crew.png">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --bg:#0f1923;--bg2:#1a2738;--bg3:#243650;
      --sky:#3b82f6;--sky2:#60a5fa;--sky-dim:#1d4ed8;
      --slate:#64748b;--silver:#94a3b8;--mist:#cbd5e1;--white:#f8fafc;
      --green:#10b981;--red:#ef4444;--amber:#f59e0b;
      --border:rgba(59,130,246,.15);--r:12px;
    }
    body{background:var(--bg);color:var(--white);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh}
    .screen{display:none;min-height:100vh}
    .screen.active{display:block}
    .center{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:20px}

    /* card */
    .card{width:100%;max-width:400px;background:rgba(26,39,56,.92);border:1px solid var(--border);border-radius:20px;padding:36px 28px}
    .logo{width:64px;height:64px;background:linear-gradient(135deg,var(--sky-dim),var(--sky));border-radius:16px;display:flex;align-items:center;justify-content:center;margin:0 auto 18px;font-size:30px;box-shadow:0 8px 24px rgba(59,130,246,.35)}
    h1{font-size:24px;font-weight:800;text-align:center;margin-bottom:4px;letter-spacing:.5px}
    .sub{font-size:11px;color:var(--silver);text-align:center;margin-bottom:28px;letter-spacing:3px;text-transform:uppercase}

    /* inputs */
    .fg{margin-bottom:18px}
    label{display:block;font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--silver);margin-bottom:7px}
    input,select,textarea{width:100%;padding:13px 15px;border-radius:var(--r);background:rgba(255,255,255,.05);border:1px solid var(--border);color:var(--white);font-size:15px;outline:none;transition:.2s;font-family:inherit;-webkit-appearance:none}
    input:focus,select:focus,textarea:focus{border-color:var(--sky);background:rgba(59,130,246,.08);box-shadow:0 0 0 3px rgba(59,130,246,.1)}
    select option{background:#1a2738;color:var(--white)}
    textarea{resize:vertical;min-height:76px}
    input[type=number]{-moz-appearance:textfield}
    input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none}

    /* buttons */
    .btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px 18px;border-radius:var(--r);font-size:15px;font-weight:700;border:none;cursor:pointer;transition:.18s;letter-spacing:.4px;font-family:inherit}
    .btn:disabled{opacity:.4;cursor:not-allowed}
    .btn-p{background:linear-gradient(135deg,var(--sky-dim),var(--sky));color:#fff;box-shadow:0 4px 14px rgba(59,130,246,.35)}
    .btn-p:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 6px 20px rgba(59,130,246,.45)}
    .btn-s{background:rgba(255,255,255,.07);color:var(--mist);border:1px solid var(--border)}
    .btn-s:hover{background:rgba(255,255,255,.12)}
    .btn-g{background:linear-gradient(135deg,#059669,var(--green));color:#fff;box-shadow:0 4px 14px rgba(16,185,129,.3)}
    .btn-sm{padding:9px 14px;font-size:13px;width:auto;border-radius:9px}

    /* topbar */
    .topbar{background:var(--bg2);border-bottom:1px solid var(--border);padding:13px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10}
    .tb-brand{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:800;letter-spacing:.5px}
    .tb-icon{width:34px;height:34px;background:linear-gradient(135deg,var(--sky-dim),var(--sky));border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
    .tb-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
    .ghost-btn{background:none;border:none;color:var(--slate);cursor:pointer;padding:6px 10px;border-radius:8px;font-size:13px;font-family:inherit;font-weight:600}
    .ghost-btn:hover{background:rgba(255,255,255,.08);color:var(--white)}
    .install-btn{background:rgba(59,130,246,.12);border:1px solid rgba(59,130,246,.35);color:var(--sky2);font-size:12px;font-weight:700;padding:6px 11px;border-radius:8px;cursor:pointer;font-family:inherit;white-space:nowrap}
    .install-btn:hover{background:rgba(59,130,246,.22)}

    /* form body */
    .form-body{width:100%;max-width:480px;margin:0 auto;padding:20px 16px 48px}

    /* photo */
    .photo-box{border:2px dashed rgba(59,130,246,.25);border-radius:var(--r);padding:20px;text-align:center;cursor:pointer;transition:.2s;background:rgba(255,255,255,.02)}
    .photo-box:hover{border-color:var(--sky);background:rgba(59,130,246,.06)}
    .photo-box .icon{font-size:32px;margin-bottom:8px}
    .photo-box .label{font-size:14px;font-weight:600;color:var(--silver)}
    .photo-box .hint{font-size:12px;color:var(--slate);margin-top:3px}
    .photo-preview{width:100%;max-height:240px;object-fit:cover;border-radius:10px;margin-top:12px;display:none;border:1px solid var(--border)}

    /* paid toggle */
    .toggle-row{display:flex;gap:8px}
    .t-btn{flex:1;padding:12px;border-radius:var(--r);font-size:13px;font-weight:700;border:1px solid var(--border);background:rgba(255,255,255,.04);color:var(--slate);cursor:pointer;transition:.18s;text-align:center;font-family:inherit;letter-spacing:.3px}
    .t-btn.on{background:rgba(59,130,246,.14);border-color:var(--sky);color:var(--sky2)}

    /* install banner */
    .install-bar{background:linear-gradient(135deg,#0f2744,var(--bg2));border:1px solid var(--border);border-radius:var(--r);padding:14px 16px;margin-bottom:20px;display:flex;align-items:center;gap:12px}
    .install-bar .txt{flex:1}
    .install-bar .title{font-size:13px;font-weight:700;color:var(--white)}
    .install-bar .hint{font-size:11px;color:var(--silver);margin-top:2px}

    /* success */
    .success-icon{width:76px;height:76px;background:linear-gradient(135deg,#059669,var(--green));border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:38px;margin:0 auto 20px;box-shadow:0 8px 28px rgba(16,185,129,.35)}
    .success-title{font-size:26px;font-weight:800;text-align:center;margin-bottom:8px}
    .success-sub{font-size:14px;color:var(--silver);text-align:center;margin-bottom:32px;line-height:1.5}

    /* util */
    .err-msg{color:var(--red);font-size:13px;margin-top:10px;padding:10px 14px;background:rgba(239,68,68,.1);border-radius:9px;border:1px solid rgba(239,68,68,.2)}
    .spin{width:18px;height:18px;border:2px solid rgba(255,255,255,.25);border-top-color:#fff;border-radius:50%;animation:_spin .7s linear infinite;display:inline-block;vertical-align:middle}
    @keyframes _spin{to{transform:rotate(360deg)}}
    .offline-dot{background:rgba(245,158,11,.15);border:1px solid rgba(245,158,11,.3);color:var(--amber);font-size:11px;padding:4px 10px;border-radius:20px;font-weight:700}
    .fade{animation:_fade .3s ease both}
    @keyframes _fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
    .opt-label{font-size:11px;font-weight:400;text-transform:none;letter-spacing:0;color:var(--slate);margin-left:4px}
    .section-title{font-size:20px;font-weight:800;margin:22px 0 18px;letter-spacing:.3px}
  </style>
</head>
<body style="background:#0f1923;color:#f8fafc">

<!-- ── LOGIN ───────────────────────────────────────────────── -->
<div id="loginScreen" class="screen active">
  <div class="center">
    <div class="card fade">
      <div class="logo">🧾</div>
      <h1>GSM Receipt</h1>
      <div class="sub">Field Capture</div>
      <div class="fg">
        <label>Email or Phone Number</label>
        <input id="loginInput" type="text" placeholder="email or (205) 555-0000" autocomplete="username">
      </div>
      <div class="fg">
        <label>PIN</label>
        <input id="pinInput" type="password" placeholder="••••" maxlength="6" autocomplete="current-password">
      </div>
      <div id="loginErr"></div>
      <button class="btn btn-p" id="loginBtn" onclick="doLogin()" style="margin-top:6px">Sign In</button>
    </div>
  </div>
</div>

<!-- ── FORM ────────────────────────────────────────────────── -->
<div id="formScreen" class="screen">
  <div class="topbar">
    <div class="tb-brand">
      <div class="tb-icon">🧾</div>
      GSM Receipt
    </div>
    <div class="tb-right">
      <span id="offlineDot" class="offline-dot" style="display:none">Offline</span>
      <button id="installTopBtn" class="install-btn" onclick="triggerInstall()" style="display:none">📲 Install</button>
      <span id="topName" style="font-size:13px;color:var(--silver)"></span>
      <button class="ghost-btn" onclick="doLogout()">Sign Out</button>
    </div>
  </div>

  <div class="form-body">
    <div id="installBar" style="display:none"></div>

    <div class="section-title">New Receipt</div>

    <div class="fg">
      <label>Job <span style="color:var(--red)">*</span></label>
      <select id="jobSel"><option value="">Select job...</option></select>
    </div>

    <div class="fg">
      <label>Photo <span class="opt-label">(optional)</span></label>
      <div class="photo-box" onclick="document.getElementById('photoFile').click()">
        <div class="icon">📷</div>
        <div class="label">Tap to take photo</div>
        <div class="hint">Camera or gallery</div>
      </div>
      <img id="photoPreview" class="photo-preview" alt="">
      <div id="removePhotoWrap" style="display:none;margin-top:8px">
        <button class="btn btn-s btn-sm" onclick="removePhoto()">✕ Remove Photo</button>
      </div>
      <input id="photoFile" type="file" accept="image/*" capture="environment" style="display:none" onchange="handlePhoto(this)">
    </div>

    <div class="fg">
      <label>Store / Vendor <span style="color:var(--red)">*</span></label>
      <input id="storeIn" type="text" placeholder="Home Depot, Lowe's, ACE Hardware...">
    </div>

    <div class="fg">
      <label>Amount <span style="color:var(--red)">*</span></label>
      <input id="amountIn" type="number" placeholder="0.00" min="0" step="0.01" inputmode="decimal">
    </div>

    <div class="fg">
      <label>Notes <span class="opt-label">(optional)</span></label>
      <textarea id="noteIn" placeholder="What was purchased? Any details..."></textarea>
    </div>

    <div class="fg">
      <label>Who Paid?</label>
      <div class="toggle-row">
        <div class="t-btn on" id="tCrew" onclick="setPaid('crew')">I Paid (Crew)</div>
        <div class="t-btn" id="tComp" onclick="setPaid('company')">Company Card</div>
      </div>
    </div>

    <div id="formErr"></div>
    <button class="btn btn-p" id="submitBtn" onclick="doSubmit()" style="margin-top:4px">Submit Receipt</button>
  </div>
</div>

<!-- ── SUCCESS ──────────────────────────────────────────────── -->
<div id="successScreen" class="screen">
  <div class="center">
    <div class="card fade" style="text-align:center">
      <div class="success-icon">✓</div>
      <div class="success-title">Receipt Saved!</div>
      <div class="success-sub" id="successMsg">Submitted successfully.</div>
      <button class="btn btn-g" onclick="newReceipt()" style="margin-bottom:12px">New Receipt</button>
      <button class="btn btn-s" onclick="doLogout()">Sign Out</button>
    </div>
  </div>
</div>

<script>
// Show any uncaught JS error on screen so it's not invisible
window.onerror = function(msg, src, line) {
  document.body.innerHTML = '<div style="padding:30px;font-family:sans-serif;background:#0f1923;color:#f8fafc;min-height:100vh"><div style="background:#7f1d1d;border:1px solid #ef4444;border-radius:12px;padding:20px;max-width:400px;margin:40px auto"><div style="font-weight:700;font-size:16px;margin-bottom:8px">⚠️ App Error</div><div style="font-size:13px;color:#fca5a5">'+msg+'</div><div style="font-size:11px;color:#f87171;margin-top:8px">Line '+line+'</div><button onclick="location.reload()" style="margin-top:16px;padding:10px 18px;background:#ef4444;border:none;border-radius:8px;color:#fff;font-weight:700;cursor:pointer;font-size:13px">Reload</button></div></div>';
};

// ── Config ────────────────────────────────────────────────────
const SB_URL  = "https://mkibgjnzbgfqjkhowafr.supabase.co";
const SB_KEY  = "sb_publishable_zh5Soyi6iNGd8CLxPfD9Lg_dVdAwDe7";
const SESS    = "gsm_rc_sess";
const Q_KEY   = "gsm_rc_q";

// ── Supabase ──────────────────────────────────────────────────
async function sb(path, opts = {}) {
  const res = await fetch(`${SB_URL}/rest/v1/${path}`, {
    ...opts,
    headers: { apikey: SB_KEY, Authorization: `Bearer ${SB_KEY}`, "Content-Type": "application/json", Prefer: opts.prefer || "return=representation", ...opts.headers },
  });
  if (!res.ok) throw new Error(await res.text());
  return res.status === 204 ? null : res.json();
}
const sbGet  = (t, q = "") => sb(`${t}?${q}`, { method: "GET" });
const sbPost = (t, d)      => sb(t, { method: "POST", body: JSON.stringify(d) });

// ── Offline queue ─────────────────────────────────────────────
const getQ   = () => JSON.parse(localStorage.getItem(Q_KEY) || "[]");
const saveQ  = q  => localStorage.setItem(Q_KEY, JSON.stringify(q));
const enqueue = row => saveQ([...getQ(), { row, ts: Date.now() }]);
async function flushQ() {
  if (!navigator.onLine) return;
  const q = getQ(); if (!q.length) return;
  const fail = [];
  for (const item of q) {
    try { await sbPost("field_receipts", item.row); } catch { fail.push(item); }
  }
  saveQ(fail);
}

// ── Image compression ─────────────────────────────────────────
function compressImg(file, maxW = 1000, q = 0.65) {
  return new Promise((resolve, reject) => {
    const img = new Image(), r = new FileReader();
    r.onerror = () => reject(new Error("read fail"));
    r.onload = e => {
      img.onerror = () => reject(new Error("load fail"));
      img.onload = () => {
        try {
          const s = Math.min(1, maxW / img.width);
          const cv = document.createElement("canvas");
          cv.width = img.width * s; cv.height = img.height * s;
          cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
          cv.toBlob(blob => {
            if (!blob) { reject(new Error("toBlob null")); return; }
            resolve({ dataUrl: cv.toDataURL("image/jpeg", q), sizeKB: Math.round(blob.size / 1024) });
          }, "image/jpeg", q);
        } catch (err) { reject(err); }
      };
      img.src = e.target.result;
    };
    r.readAsDataURL(file);
  });
}

// ── State ─────────────────────────────────────────────────────
let sess = null, jobs = [], paidBy = "crew", photoUrl = null, submitting = false;
let deferredInstall = null;

// ── Screens ───────────────────────────────────────────────────
function show(id) {
  ["loginScreen","formScreen","successScreen"].forEach(s => {
    document.getElementById(s).classList.remove("active");
  });
  document.getElementById(id).classList.add("active");
}
function setErr(id, msg) {
  const el = document.getElementById(id);
  el.innerHTML = msg ? `<div class="err-msg">${msg}</div>` : "";
}
function setBtn(id, loading, text) {
  const b = document.getElementById(id);
  b.disabled = loading;
  b.innerHTML = loading ? '<span class="spin"></span>' : text;
}

// ── Login ─────────────────────────────────────────────────────
async function doLogin() {
  if (submitting) return;
  const login = document.getElementById("loginInput").value.trim();
  const pin   = document.getElementById("pinInput").value.trim();
  if (!login || !pin) { setErr("loginErr", "Enter your email or phone and PIN."); return; }
  setErr("loginErr", ""); setBtn("loginBtn", true, "");
  try {
    let rows = await sbGet("field_profiles", `email=eq.${encodeURIComponent(login.toLowerCase())}&select=*`);
    if (!rows?.length) {
      const dig = login.replace(/\D/g,"").slice(-10);
      const all = await sbGet("field_profiles","select=*");
      rows = (all||[]).filter(p => p.phone && p.phone.replace(/\D/g,"").slice(-10) === dig);
    }
    const u = rows?.[0];
    if (!u || u.pin !== pin) { setErr("loginErr","Invalid credentials."); setBtn("loginBtn",false,"Sign In"); return; }
    if (u.active === false)   { setErr("loginErr","Account deactivated."); setBtn("loginBtn",false,"Sign In"); return; }
    sess = { id: u.id, name: u.name, role: u.role };
    localStorage.setItem(SESS, JSON.stringify(sess));
    await enterApp();
  } catch {
    setErr("loginErr","Connection error — check your signal.");
    setBtn("loginBtn", false, "Sign In");
  }
}

function doLogout() {
  sess = null;
  submitting = false;
  localStorage.removeItem(SESS);
  photoUrl = null;
  document.getElementById("loginInput").value = "";
  document.getElementById("pinInput").value = "";
  document.getElementById("installBar").style.display = "none";
  show("loginScreen");
}

// ── Enter app ─────────────────────────────────────────────────
async function enterApp() {
  setBtn("loginBtn", false, "Sign In");
  document.getElementById("topName").textContent = (sess.name || "").split(" ")[0];

  // Show screen immediately — don't block on job fetch
  resetForm();
  show("formScreen");
  window.scrollTo(0, 0);
  refreshInstallUI();

  // Load jobs in background, show loading state in dropdown
  const sel = document.getElementById("jobSel");
  sel.innerHTML = '<option value="">Loading jobs...</option>';
  sel.disabled = true;
  try {
    const res = await sbGet("field_jobs","status=neq.closed&order=name");
    jobs = res || [];
  } catch { jobs = []; }
  sel.disabled = false;
  sel.innerHTML = '<option value="">Select job...</option>';
  jobs.forEach(j => {
    const o = document.createElement("option");
    o.value = j.id; o.textContent = j.name; sel.appendChild(o);
  });

  flushQ();
}

// ── Photo ─────────────────────────────────────────────────────
async function handlePhoto(input) {
  const file = input.files[0]; if (!file) return;
  try {
    const { dataUrl } = await compressImg(file);
    photoUrl = dataUrl;
    const prev = document.getElementById("photoPreview");
    prev.src = dataUrl; prev.style.display = "block";
    document.getElementById("removePhotoWrap").style.display = "block";
  } catch { alert("Could not process photo. Try again."); }
  input.value = "";
}
function removePhoto() {
  photoUrl = null;
  document.getElementById("photoPreview").style.display = "none";
  document.getElementById("removePhotoWrap").style.display = "none";
  document.getElementById("photoFile").value = "";
}

// ── Paid toggle ───────────────────────────────────────────────
function setPaid(val) {
  paidBy = val;
  document.getElementById("tCrew").classList.toggle("on", val === "crew");
  document.getElementById("tComp").classList.toggle("on", val === "company");
}

// ── Submit ────────────────────────────────────────────────────
async function doSubmit() {
  if (submitting) return;
  const jobId  = document.getElementById("jobSel").value;
  const store  = document.getElementById("storeIn").value.trim();
  const amount = document.getElementById("amountIn").value.trim();
  const note   = document.getElementById("noteIn").value.trim();

  if (!jobId)  { setErr("formErr","Select a job."); return; }
  if (!store)  { setErr("formErr","Enter the store / vendor name."); return; }
  if (!amount || isNaN(parseFloat(amount))) { setErr("formErr","Enter a valid amount."); return; }

  setErr("formErr",""); submitting = true; setBtn("submitBtn", true, "");

  const id  = "r" + Date.now();
  const row = {
    id, job_id: jobId, crew_id: sess.id, task_id: null,
    data_url: photoUrl || null, store,
    amount: parseFloat(amount),
    note: note || null,
    paid_by: paidBy,
    reimbursement_status: paidBy === "crew" ? "pending" : "na",
    bill_status: "pending_review",
  };

  let saved = false;
  try { await sbPost("field_receipts", row); saved = true; }
  catch { enqueue(row); }

  submitting = false; setBtn("submitBtn", false, "Submit Receipt");

  const jobName = jobs.find(j => j.id === jobId)?.name || "";
  document.getElementById("successMsg").textContent = saved
    ? `Saved for ${jobName}.`
    : `Saved offline for ${jobName}.\nWill sync when back online.`;
  show("successScreen");
}

function newReceipt() { resetForm(); show("formScreen"); window.scrollTo(0,0); }

function resetForm() {
  document.getElementById("jobSel").value = "";
  document.getElementById("storeIn").value = "";
  document.getElementById("amountIn").value = "";
  document.getElementById("noteIn").value = "";
  removePhoto(); setPaid("crew"); setErr("formErr","");
}

// ── Install prompt ────────────────────────────────────────────
const isIOS = () => /iphone|ipad|ipod/i.test(navigator.userAgent);
const isStandalone = () => window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true;

// Capture Android deferred prompt early
window._pwaPrompt = null;
window.addEventListener("beforeinstallprompt", e => {
  e.preventDefault();
  window._pwaPrompt = e;
  deferredInstall = e;
  refreshInstallUI();
});

function refreshInstallUI() {
  if (isStandalone()) {
    document.getElementById("installTopBtn").style.display = "none";
    document.getElementById("installBar").style.display = "none";
    return;
  }
  // Show topbar button whenever not standalone
  document.getElementById("installTopBtn").style.display = "inline-block";

  if (deferredInstall) {
    // Android: show banner
    const bar = document.getElementById("installBar");
    bar.style.display = "flex";
    bar.innerHTML = `
      <span style="font-size:26px;flex-shrink:0">📲</span>
      <div class="txt"><div class="title">Install the App</div><div class="hint">Save to home screen — works offline</div></div>
      <button class="btn btn-p btn-sm" onclick="doInstall()">Install</button>
      <button class="btn btn-s btn-sm" onclick="document.getElementById('installBar').style.display='none'" style="padding:9px 10px;flex-shrink:0">✕</button>
    `;
  }
}

async function triggerInstall() {
  if (isStandalone()) return;
  if (deferredInstall) { doInstall(); return; }
  if (isIOS()) { showIOSGuide(); return; }
  // Android without prompt — show manual instructions
  alert("In Chrome: tap the 3-dot menu (⋮) → 'Add to Home Screen'");
}

async function doInstall() {
  if (!deferredInstall) return;
  deferredInstall.prompt();
  await deferredInstall.userChoice;
  deferredInstall = null;
  document.getElementById("installBar").style.display = "none";
  document.getElementById("installTopBtn").style.display = "none";
}

      </div>
      <div style="display:flex;flex-direction:column;gap:12px">

          <div style="font-size:13px;color:var(--white);padding-top:4px">📤 Tap the <strong>Share</strong> button in Safari's bottom toolbar</div>

          <div style="width:26px;height:26px;border-radius:50%;background:var(--sky);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;flex-shrink:0">2</div>

// Auto-show iOS guide every visit until installed
if (isIOS() && !isStandalone()) {
  setTimeout(() => showIOSGuide(), 3000);
}

// ── Offline indicator ─────────────────────────────────────────
function syncOnline() {
  document.getElementById("offlineDot").style.display = navigator.onLine ? "none" : "inline-block";
  if (navigator.onLine) flushQ();
}
window.addEventListener("online",  syncOnline);
window.addEventListener("offline", syncOnline);
syncOnline();

// ── Enter key on PIN ──────────────────────────────────────────
document.getElementById("pinInput").addEventListener("keydown", e => { if (e.key === "Enter") doLogin(); });

// ── Init ──────────────────────────────────────────────────────
(function() {
  try {
    const s = localStorage.getItem(SESS);
    if (s) { sess = JSON.parse(s); enterApp(); return; }
  } catch {}
  // Always ensure login screen is visible
  try { show("loginScreen"); } catch {}
})();
</script>

<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("/receipt/sw.js", { scope: "/receipt/" }).catch(() => {});
  });
}
</script>
